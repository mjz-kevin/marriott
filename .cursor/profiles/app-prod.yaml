
team: APP
display_name: APP 团队

mcp:
  jira:
    host: https://marriottcloud.atlassian.net
    project_key: CNAPP
    issue_type: "故事"
    initial_status: backlog
    agile_team: "Team Lóng"          # 建单默认 Agile Team：所有 CNAPP scrum 团队接的票必选 Team Lóng
    labels:                          # 标签枚举，来源见 source；大小写敏感
      source: "https://marriottcloud.atlassian.net/wiki/spaces/DBU4/pages/3386999508"
      case_sensitive: true
      auto_fill: [business_domain, ai_provenance]   # 允许自动填充的类别；未列出的仅作合法值校验
      ai_provenance:                 # 溯源标签：凡经 agent 创建/同步的 Jira，建单时恒定自动打上
        auto_apply: always           # 无条件添加，不依赖需求内容
        select: unique
        values: [AIGenerated]        # 固定值（无空格：Jira label 不允许空格，否则会被拆成两个标签）
      business_domain:               # 必填、单选：CNAPP 的票必须打这四个之一，否则会被过滤掉
        mandatory: true
        select: unique
        filter_gate: true            # 缺失即被下游过滤：建单前硬门禁，缺一即停
        values: [Commerce, Loyalty, Trips, Platform]   # Content 已并入 Loyalty
      process_labels:                # 过程标签，仅校验、不自动填
        auto_fill: false
        values: [AdhocRequest, UnplannedSprintTicket, CrossSprintTicket, CrossSprintCommitted, DevOnly, QAOnly, Compliance, NoCodeChanges, BugReviewed, Design, VQA, StoryBug, RegressionBug, ProdKnownIssue, ProdIncident, BugPriorityUpdated]
    components:                      # Jira Component 字段规则（CNAPP）
      platform_rule:
        ios_only: iOS                # 仅 iOS 专属的票：Component 选 iOS
        android: none                # Android 票：不选任何 Component
        note: "只有 iOS 专属票选 Component=iOS；Android 票不选 Component。跨端/无关平台的票按需留空。"
    links: [prd, figma, tech_solution]

  confluence:
    base_url: https://marriottcloud.atlassian.net/wiki
    space: CMI
    parent_pages:
      # 文件夹模式（当前）：一级根目录「Mobile Team Requirement Materials」folder 页 ID。
      # 发布脚本在此根下自动建/找 {initiative} → {epic} → {epic}-PRD / {epic}-Tech Solution。
      # {initiative} 取 Epic 的父级 Jira key（Initiative/计划，如 PORT-1301）；{epic} 取 Jira Epic key（如 CNAPP-5661）。
      # {initiative} 与 {epic} 夹标题由脚本查 Jira 摘要拼为「key-摘要」（如 CNAPP-5661-会员权益重构），
      # 幂等查重按 Jira key 前缀匹配，摘要文案变动不会重复建夹。
      root: "4198957209"             # 一级根目录页 ID（Mobile Team Requirement Materials，prod/CMI，folder 类型）
      # 旧模式回退（直接父页，仅当未走文件夹模式时使用）：
      prd: "4191912061"
      tech_solution: "4192731190"
    folder_layout:                   # 文件夹层级约定（供 skill 说明用；实际由脚本 --root/--initiative/--epic/--kind 落地）
      level1: "Mobile Team Requirement Materials"   # 一级：固定根目录（即 parent_pages.root）
      level2: "{initiative}"                        # 二级：Initiative（Epic 父级）夹，标题「key-摘要」，无父项时省略
      level3: "{epic}"                              # 三级：Epic 夹，标题「key-摘要」，如 CNAPP-5661-会员权益重构
      level4_prd: "{epic}-PRD"                      # 四级：PRD 归档夹
      level4_tech_solution: "{epic}-Tech Solution"  # 四级：技术方案归档夹
    naming:                            # 标题前缀（唯一键=前缀+Jira key）；脚本自动追加「-Jira 摘要」为可读尾巴，日期/版本不进标题
      prd: "APP-PRD-{epic}"
      tech_solution_prd: "APP-TS-Prd-{epic}"
      tech_solution_spike: "APP-TS-Spike-{spike_key}"
      tech_solution_detail: "APP-TS-Detail-{story_key}"
    content_format: markdown

# ---------------------------------------------------------------- 内容模型
content_model:
  required: false

# ---------------------------------------------------------------- 产物语言
doc:
  body_language: en-US
  ac_language: en-US

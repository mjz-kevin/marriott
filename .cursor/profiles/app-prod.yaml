
team: APP
display_name: APP 团队

mcp:
  jira:
    host: https://marriottcloud.atlassian.net
    project_key: CNAPP
    issue_type: "故事"
    initial_status: BACKLOG
    workflow: ["BACKLOG", "ANALYSIS", "REFINEMENT", "PLAN", "正在进行", "GO LIVE", "已完成"]   # CNAPP 故事(Story)真实工作流状态序列（名称逐字对齐 Jira；正在进行/已完成为本地化显示名）；dev-agent push 成功后向前流转
    agile_team: "Team Lóng"          # 建单默认 Agile Team：所有 CNAPP scrum 团队接的票必选 Team Lóng
    labels:                          # 标签枚举，来源见 source；大小写敏感
      source: "https://marriottcloud.atlassian.net/wiki/spaces/DBU4/pages/3386999508"
      case_sensitive: true
      auto_fill: [business_domain, platform, ai_provenance]   # 允许自动填充的类别；未列出的仅作合法值校验
      ai_provenance:                 # 溯源标签：凡经 agent 创建/同步的 Jira，建单时恒定自动打上
        auto_apply: always           # 无条件添加，不依赖需求内容
        select: unique
        values: [AIGenerated]        # 固定值（无空格：Jira label 不允许空格，否则会被拆成两个标签）
      business_domain:               # 必填、单选：CNAPP 的票必须打这四个之一，否则会被过滤掉
        mandatory: true
        select: unique
        filter_gate: true            # 缺失即被下游过滤：建单前硬门禁，缺一即停
        values: [Commerce, Loyalty, Trips, Platform]   # Content 已并入 Loyalty
        # 域判定（分层降级，最终以 Story 功能性质校验，不盲从任一信号）：
        #  1) Epic 自身有 business_domain 标签 → 默认继承为该域（最权威），但单张 Story 功能性质明显不同可偏离
        #  2) Epic 无标签 → 参考同 Epic 兄弟 Story 的多数域作为推测；与多数不一致时提示为异常待确认（如兄弟均 Commerce 却标 Trips）
        #  3) 仍不足 → 回到 labels.source 官方页面的域定义，按 Story 功能性质判定
        # 判定依据不在本地固化域含义；命中多条时取最贴近核心价值的一条，不凭标题字面直觉。
      platform:                      # 平台标签：与 Component 平台规则联动，iOS 专属票必打 iOS 标签
        mandatory: true
        select: unique               # 单端票取该端；跨端票由建单人显式判定
        filter_gate: false           # 非过滤门禁，但属 iOS 专属票的必填项（见 platform_binding）
        values: [iOS, Android]
        platform_binding: components.platform_rule   # 与 Component 规则同源：Component=iOS 的票，platform 标签必为 iOS
      process_labels:                # 过程标签，仅校验、不自动填
        auto_fill: false
        values: [AdhocRequest, UnplannedSprintTicket, CrossSprintTicket, CrossSprintCommitted, DevOnly, QAOnly, Compliance, NoCodeChanges, BugReviewed, Design, VQA, StoryBug, RegressionBug, ProdKnownIssue, ProdIncident, BugPriorityUpdated]
    components:                      # Jira Component 字段规则（CNAPP）
      platform_rule:
        ios_only: iOS                # 仅 iOS 专属的票：Component 选 iOS
        android: none                # Android 票：不选任何 Component
        note: "只有 iOS 专属票选 Component=iOS；Android 票不选 Component。跨端/无关平台的票按需留空。同时按 labels.platform 规则打上对应平台标签（iOS 专属票必打 iOS 标签）。"
    summary_prefix:                  # 建单标题（summary）平台前缀：与 components/labels 的平台判定同源
      android: "[Android]"           # Android 票 summary 以 [Android] 开头
      ios: "[iOS]"                   # iOS 票 summary 以 [iOS] 开头
      note: "按票的平台在 summary 前加 [Android]/[iOS]；平台不明时先判定平台再建单，不臆测。用户已自带前缀则不重复添加。跨端/无关平台按需省略。"
    links: [prd, figma, tech_solution]
    figma_embed:                     # Figma UI 设计在工单里的落地方式：link=仅可点击链接（历史默认）；embed=链接 + 把设计节点导出为 PNG 作附件内嵌进描述
      mode: embed                    # embed=建单时导出 Figma 节点为 PNG、上传为 Jira 附件、以 ADF media 内嵌进描述（经 Jira REST，MCP-only 的受控例外）；link=退回仅链接
      png_scale: 1                   # 导出 PNG 的缩放倍数（download_figma_images 的 pngScale）；工单内嵌 1x 已够看清，2x 体积约 4 倍、上传更慢
      max_height_px: 2400            # 待导出节点高度（Figma 设计稿尺寸，单位 px）上限；超过即判定为整页长图，不导出，改为推荐卡片 / 屏级子节点让用户确认
      heading: "UI Design"           # 内嵌图片前插入的描述标题段文字
    bug:                             # test-run-report-bug 建 Bug 配置（自动化失败建单 / 手动建单共用）
      project_key: CNAPP             # Bug 所在项目（与顶层 project_key 一致，显式留存便于演进）
      issue_type: "缺陷"             # Bug issue type（id 10007）
      domain_values: [Commerce, Loyalty, Trips, Platform]   # Domain 自定义字段取值；与 labels.business_domain.values 同源，勿两处漂移
      severity_default: "3-Medium"   # customfield_10136 默认档，可按严重度上下调
      environments: "Test"           # customfield_10042（建单必填），自动化属测试环境
      replication_steps_field: customfield_10086   # Replication Steps 字段
      severity_field: customfield_10136
      environments_field: customfield_10042
      regression_story: CNAPP-7206   # 每个 Bug 用 Blocks 链到的回归缺陷收集 Story
      link_type: Blocks              # 链接类型（Bug Blocks -> regression_story）

  confluence:
    base_url: https://marriottcloud.atlassian.net/wiki
    space: CMI
    parent_pages:
      # 文件夹模式（当前）：一级根目录「Mobile Team Requirement Materials - for AI SDLC Test」folder 页 ID（CMI 空间，app prod 根）。
      # 发布脚本在此根下自动建/找 {initiative} → {epic} → {epic}-PRD / {epic}-Tech Solution / {epic}-TestCase。
      # {initiative} 取 Epic 的父级 Jira key（Initiative/计划，如 PORT-1301）；{epic} 取 Jira Epic key（如 CNAPP-5661）。
      # {initiative} 与 {epic} 夹标题由脚本查 Jira 摘要拼为「key-摘要」（如 CNAPP-5661-会员权益重构），
      # 幂等查重按 Jira key 前缀匹配，摘要文案变动不会重复建夹。
      root: "4191912061"             # 一级根目录页 ID（Mobile Team Requirement Materials - for AI SDLC Test，prod/CMI，folder 类型）
      # 旧模式回退（直接父页，仅当未走文件夹模式时使用）：
      prd: "4191912061"
      tech_solution: "4192731190"
    folder_layout:                   # 文件夹层级约定（供 skill 说明用；实际由脚本 --root/--initiative/--epic/--kind 落地）
      level1: "Mobile Team Requirement Materials - for AI SDLC Test"   # 一级：固定根目录（即 parent_pages.root）
      level2: "{initiative}"                        # 二级：Initiative（Epic 父级）夹，标题「key-摘要」，无父项时省略
      level3: "{epic}"                              # 三级：Epic 夹，标题「key-摘要」，如 CNAPP-5661-会员权益重构
      level4_prd: "{epic}-PRD"                      # 四级：PRD 归档夹
      level4_tech_solution: "{epic}-Tech Solution"  # 四级：技术方案归档夹
      level4_test_case: "{epic}-TestCase"           # 四级：app 功能用例归档夹（与 PRD / Tech Solution 平级，jira-to-test-case 的 app 目标用，--kind test_case）
    naming:                            # 标题前缀（唯一键=前缀+Jira key）；脚本自动追加「-Jira 摘要」为可读尾巴，日期/版本不进标题
      prd: "APP-PRD-{epic}"
      tech_solution_prd: "APP-TS-Prd-{epic}"
      tech_solution_spike: "APP-TS-Spike-{spike_key}"
      tech_solution_detail: "APP-TS-Detail-{story_key}"
    content_format: markdown
    test:                              # 测试线各 Confluence 落点（jira-to-test-case / test-page-elements / test-run-report-bug 用）
      # 知识库（app_doc / page_doc / cms_doc / cms_page + 两个导航页）、memory 页、运行报告根均在 DBU4 空间（test/prod 共用同一套知识库）；
      # 本节 space 即 DBU4。
      # app 功能用例不落本节——它改走需求/方案线 folder 模式（见上方 confluence.parent_pages.root + folder_layout.level4_test_case），
      # 与 {epic}-Tech Solution 平级落在 {epic}-TestCase 夹（prod 需求线 space=CMI）。
      space: "DBU4"                    # 测试线知识库 / memory / 运行报告所在 space（DBU4）
      space_id: "329154959"            # DBU4 space 的数字 ID
      cloud_id: "627b9bb1-1899-4ff6-bc6e-066cf136a066"
      folders:                         # 发布脚本 --parent 的目标 folderId
        app_doc:     "4260299195"      # app 页面元素知识库根 folder（内含 page_doc + iOS 导航页；对称于 cms_doc）
        page_doc:    "4280157634"      # app 页面元素文档（iOS Page Elements - ...），在 app_doc 下
        cms_doc:     "4281205569"      # cms README + 导航页所在 folder（cms 知识库根）
        cms_page:    "4281827573"      # cms 模块文档 folder，在 cms_doc 下
        report_root: "4192207633"      # 运行报告根 folder「Automation Report」(DBU4)；运行时先问用户平台+版本号，在其下找/建二级夹「<iOS|Android> <版本号>」(如 iOS 26.8 / Android 11.15)，报告页落入该二级夹
      nav_pages:                       # 活数据导航页（运行时读写，非发布 folder）；均在 DBU4
        app_page_map:   "4280157316"   # iOS Page Map & Inventory 导航页（在 app_doc 下）
        cms_module_map: "4280551711"   # CMS Module Map & Inventory 导航页（在 cms_doc 下）
      memory_pages:                    # 两个记忆库 Confluence 页（DBU4 空间 folder 4363354130），skill 从这里读/写
        folder: "4363354130"
        test_case:   "4364632091"      # test-case-memory 页（步骤拆解案例库）
        test_script: "4364992536"      # test-script-memory 页（通用技术规则库）

  github:                              # GitHub（自建 GHES）连接 scope；开发/验证类 skill 的 MCP 读写落点
    host: git.marriott.com             # 自建 GHES 域名
    org: cnexperience                  # 组织/所有者（owner），四个仓库同 org
    repos:                             # 交付的代码仓库（每端一个）；base=各仓库真实基线分支（两端不同）
      ios:     { repo: cnexperience/ios-dragon-app,     base: develop }
      android: { repo: cnexperience/android-dragon-app, base: dev }
    # 兼容旧引用：单一 default_branch 已废弃，基线分支改由 repos.*.base 提供（每仓库不同）

  harness:                             # Harness 连接 scope；harness-invoke（CI/CD 环节）触发流水线并查执行状态的落点。
    base_url: https://marriott.harness.io   # Harness 实例地址（UI URL 前缀；skill 可用 url 快捷方式让 MCP 自动抽取 scope）
    org_id: cnexperience                    # Harness Organization 标识（MCP 调用必传）
    project_id: cnmobile                    # Harness Project 标识（移动端 iOS/Android 同一 project；MCP 调用必传）
    # account_id 与 API 凭据不写在此处：二者均从 MCP 配置（mcp.json → harness 服务的 env）读取，
    # 保持单一事实来源，也避免凭据与账号标识随 profile 进入版本库。
    #
    # 本节只记录「人的决策」：哪条流水线属于本团队交付路径、哪些环境在范围内、哪条禁止 agent 触发。
    # 不记录可从 Harness 查到的事实（入参规格与默认值、取值域、input set、stage 结构）——
    # 那些一律由 harness-invoke 在触发前运行时读取，以 Harness 为唯一权威来源。
    #
    # 范围收口：本工具链的 CI/CD 环节只发布低环境（dev / test）。高环境（staging / prod）一律不触发，
    # 既不登记为可触发流水线，也没有「人工确认后放行」的通道——高环境发布由人在 Harness UI 操作。
    pipelines:                         # 可触发的低环境流水线清单；APP 按 platform + env(+usage) 唯一定位。
                                       # 未登记 = 不可触发（skill 遇无匹配即停止，不猜）：故 detekt / 安全扫描 /
                                       # 各类 *_Test / *_Sandbox 共 13 条，以及全部高环境流水线
                                       # （iOS_Dragon_App_Testflight_Prod / Android_Gold_Build /
                                       # Mobile_s3_upload_Prod）都刻意不列在此处。
      - { id: iOS_Dragon_App_Testflight_Dev,  platform: ios,     env: dev,  usage: testflight, repo: ios-dragon-app, artifact_stage: TestFlight_Metadata }
                                       # ↑ artifact_stage：判定「这次 build 已可下载」的 stage（harness-invoke 查最新 build 用）。
                                       #   只有入参 uploadTo 含 TestFlight 才会上传；PR 自动触发的运行也会 Success 但跳过该 stage，
                                       #   TestFlight 上没有这个包。build 号 = Harness Build Id（runSequence = <+pipeline.sequenceId>）。
      - { id: Android_Adhoc_Build,            platform: android, env: test, usage: adhoc,      repo: android-dragon-app }
                                       # ↑ 注意：该流水线的 flavor 输入才决定包连哪套后端
                                       # （Harness 取值域 Tst/Tst2/Uat2/Stg/Perf/Prod，默认 Tst），
                                       # 取 Uat2/Stg/Perf/Prod 会构建指向高环境后端的包并经 Appcircle 分发给测试者；
                                       # 这类「取值点名高环境」的入参由 harness-invoke 统一拦截，无需在此登记取值表。
                                       # 唯一例外是下方 build_backend_exceptions 登记的 flavor=Stg（QA 日常 STG 测试包）。
      - { id: Android_Regression_Builds,      platform: android, env: test, usage: regression, repo: android-dragon-app }
      - { id: Mobile_s3_upload,               platform: both,    env: dev,  usage: config-upload, repo: mobile-config-upload-dev }
    allowed_envs: [dev, test]          # 允许触发的环境白名单（低环境）。本队流水线均为纯 CI（无 CD stage、无
                                       # environmentRef），cnmobile 项目里也没有 dev/test 这种 Harness environment，
                                       # 故这里比对的是上面 pipelines 的 env 标签（团队自定的选流水线维度）。
                                       # 另外，若某个运行时入参的取值点名了高环境（如 flavor=Prod、网关 URL 指向 stg/prf），
                                       # harness-invoke 同样按超范围停止——判定依据始终是「这次实际打向哪里」，不是标签。
                                       # 不在白名单内 → skill 直接停止并提示去 Harness UI，没有人工确认放行通道。
    build_backend_exceptions:          # 窄口径例外（QA日常需要打连 STG 后端的测试包）。
      - { pipeline: Android_Adhoc_Build, input: flavor, values: [Stg], backend: stg }
    allow_stage_execution_fallback: false  # 本项目流水线均为单环境、无晋级链，不需要 stage 子集限定
    poll:                              # 触发后等待执行状态的口径
      mode: server_wait                # 优先用 MCP 的服务端阻塞等待（wait=true），而非 LLM 轮询循环
      timeout_seconds: 3600            # 等待总超时；超时回报「仍在运行」并给句柄，不判成败
      interval_seconds: 30             # 回退轮询时的间隔
# ---------------------------------------------------------------- 代码工程（开发/验证类 skill 用）
code:
  languages: [swift, kotlin]           # 语言栈：iOS=swift / Android=kotlin
  # 分支命名：对齐团队 Branching Strategy 的 {KEY}-Xxx-Xxx；AI 套 prefix。{slug}=2–3 个 Title-Case 词，非整句摘要
  branch:
    prefix: feat-ai                    # AI 专属前缀，与人工 Feature（无前缀）隔离
    template: "feat-ai/{story_key}-{slug}"
  build:                              # 构建校验的语义配置（build-verify 按 OS 组装命令），按 repo 键区分；对齐各仓 CI
    ios:                               # 仅 macOS 可执行（iOS 固有约束）
      tool: xcodebuild
      project: DragonApp.xcodeproj     # xcodeproj（非 workspace）
      scheme: DragonApp
      destination: "generic/platform=iOS"
      action: build                    # skill 组装为 `xcodebuild -project ... -scheme ... -destination ... build`
    android:
      tool: gradle                     # skill 按 OS 选 wrapper：Unix=./gradlew，Windows=gradlew.bat（不硬编码 ./gradlew）
      tasks: [clean, assembleOneTstDebug] # gradle wrapper 8.11.1 / AGP 8.9.3 / Kotlin 2.1.10；构建 flavor=oneTst（PR 门禁在 Harness .harness/.../*.yaml，GitHub PRValidation.yml 的 pull_request 触发已注释、仅 workflow_dispatch）；须用 JDK 17（勿用 Android Studio 内置更高版本 JDK）；本地构建前置：仓库根目录需 Vault 密钥文件 secret_android_api_keys.json，私有依赖仓库（腾讯 EdgeOne maven.cnb.cool）需 EDGE_ONE_REPO_USER/PW 凭据
      static_check_tasks: [clean, detekt] # 静态检查用标准 detekt 任务（gradle/detekt.gradle 提供；detektAll 未在 gradle 定义、勿用）；detekt 真实 PR 门禁在 Harness（.harness .../detekt.yaml 跑 ./gradlew --no-daemon detekt）
  git_hooks:                          # 各仓本地 git 钩子行为（dev-agent 提交前须知：提交会触发这些检查/校验，提前预跑与对齐避免"撞上才知道"；非硬编码命令，仅声明语义与真实脚本来源）
    android:                           # 版本化钩子：源在 config/hooks/，由 gradle/git-hooks.gradle.kts 的 installGitHooks 任务在 preBuild 时复制到 .git/hooks/
      mechanism: versioned_config_hooks # core.hooksPath 未设，走默认 .git/hooks；每次 gradle build 自动安装
      pre_commit: detekt               # 跑 `./gradlew --no-daemon detekt`（Kotlin 静态检查），失败阻断提交
      commit_msg:                      # 强制提交信息格式（config/hooks/commit-msg），dev-agent 生成 Android 提交信息必须满足
        format: "[CNAPP-XXXXX] description"  # 首行须以 [CNAPP-数字] 开头（ticket 号 1–6 位）后接一个空格再接描述
        subject_issue_tag: required    # 与 CMS 不同：issue 标注是强制的，不可省
        min_desc_chars: 20             # 描述至少 20 字符（少于则阻断）
        max_desc_chars: 72             # 建议上限 72（超过仅警告，不阻断）
        min_words: 3                   # 建议至少 3 个词（少于仅警告）
        language: english_only         # 描述仅允许英文字母/数字/空格/基本标点，含中文等字符阻断
        bypass_prefixes: [Merge, Revert, "feat:", "fix:", "docs:", "chore:", "build:", "ci:", "style:", "refactor:", "perf:", WIP, Release] # 这些特殊前缀跳过格式校验（详见脚本）
    ios:                               # ios-dragon-app 当前无任何自定义 git 钩子
      mechanism: none
      pre_commit: null
      commit_msg: null
  commit:                             # 提交信息约定（dev-agent D6 生成 commit message 用）；按 repo 区分，与 git_hooks.*.commit_msg 对齐
    android:
      convention: jira_bracket_prefix  # 恒为 `[CNAPP-XXXXX] description`（受 commit-msg 钩子强制，见上）；描述英文、≥20 字符、≥3 词
      language: english                # 强制英文，禁中文
    ios:
      convention: conventional_commits # 无钩子强制；遵循仓库历史惯例（Conventional Commits），issue 标注可选
      subject_issue_tag: optional
      language: any
  ai_provenance:                      # AI 辅助代码溯源标识（dev-agent D6 / create-pr 用）：落在 commit 与 PR 上，合并后仍可追溯
    commit_trailer: "AI-Assisted: Cursor dev-agent"  # 追加在 commit message 末尾的 git trailer（与正文空一行，作最后一段）；android commit-msg 钩子只校验首行，不受影响
    pr_label: AIGenerated             # PR 上打的 GitHub label（与 Jira ai_provenance 同名）；仓库无此 label 时不自建，提示 DEV 处理
  pr:                                 # create-pr 用：按 diff 推断 PR 的 labels / reviewers；键 = mcp.github.repos.<key>。无此键 = 不推断（Android 待补）。
                                      # 推断结果须经 DEV 在草稿中确认后才调用工具；label 须仓库已存在（不自建）。
                                      # owner 由仓库 CODEOWNERS 自动请求，此处只记 owner 之外的同事。
    ios:
      type_labels:                    # Jira issue type（dev-agent D1 读到的 Story 类型，显示名逐字对齐）→ 类型 label；未列出的类型不打类型 label
        Story: story
        Bug: bug
      modules:                        # 模块 label：按 diff 改动路径（glob，相对仓库根）命中；命中文件数最多的为主模块，只打 1 个模块 label
        - { label: Loyalty,  paths: ["Module/ios-dragon-module-loyalty/**"],  reviewers: [czhan767] }
        - { label: Search,   paths: ["Module/ios-dragon-module-search/**"],   reviewers: [nliu531, bma845, ttang727] }
        - { label: Booking,  paths: ["Module/ios-dragon-module-booking/**"],  reviewers: [nliu531, bma845, ttang727] }
        - { label: Trips,    paths: ["Module/ios-dragon-module-trips/**"],    reviewers: [mhou516] }
        - { label: Content,  paths: ["Module/ios-dragon-module-discover/**"], reviewers: [edu548] }
        - { label: Platform, paths: ["Module/ios-dragon-library-common*/**", "Module/ios-dragon-library-uxl/**", "Module/ios-dragon-library-mboxes/**", "Module/ios-dragon-library-keys/**", "DragonApp/**"], reviewers: [lyang008, mai092, ttang727] }
      combine:                        # 多模块合并规则：同时命中 when_all 中所有模块时，模块 label 改用 use（reviewers 取并集）
        - { when_all: [Search, Booking], use: Commerce }
      max_reviewers: 3                # 追加的 reviewer 上限（去掉 PR 作者本人后截断）
  contract:                           # contract-diff 口径：接口契约以技术方案 detail 的接口定义为基线
    source: tech_solution_detail       # 契约基线来源：Story 级明细方案的接口定义章节
    match: field_level                 # 比对粒度：逐字段（Swift 看 Codable/CodingKeys；Kotlin 看 data class/注解）

# ---------------------------------------------------------------- 代码审核（代码审核类 skill 用）
review:
  rules_source:                       # code-review-rules 用：APP 团队编码规范来源。扫描本地仓库得到：Android 有 detekt/editorconfig；iOS 暂无 lint 规范文件。
    kind: repo_file                   # 来源类型：confluence（团队规范页）/ repo_file（仓库内规范文件）/ github（GitHub MCP get_file_contents）；本节按来源就近标注
    common:                           # 跨语言通用规范：对所有语言子键（swift/kotlin/typescript）一并适用
      - name: Marriott Naming Conventions
        kind: confluence                # 经 Atlassian(Confluence) MCP getConfluencePage 读取
        confluence:
          space: TIP
          page_id: "262439119"
          url: https://marriottcloud.atlassian.net/wiki/spaces/TIP/pages/262439119/Marriott+Naming+Conventions
        dimensions: [命名, 分层/职责]
    swift: []                         # iOS（ios-dragon-app）暂无 SwiftLint/SwiftFormat 规范文件 → 该语言仅按 common + 内置通用维度审核；有规范后追加
    kotlin:                           # Android（android-dragon-app）仓库内规范文件
      - name: detekt ruleset
        repo: android                 # 对应 mcp.github.repos.android
        path: config/detekt/detekt.yml
        url: https://git.marriott.com/cnexperience/android-dragon-app/blob/dev/config/detekt/detekt.yml
        dimensions: [命名, 分层/职责, 异常处理, 性能]
      - name: EditorConfig
        repo: android
        path: .editorconfig
        url: https://git.marriott.com/cnexperience/android-dragon-app/blob/dev/.editorconfig
        dimensions: [命名]
  ignore_globs:                       # diff-fetch 免审文件：生成物/锁文件不纳入审核上下文
    - "**/Package.resolved"           # SPM 锁文件
    - "**/*.pbxproj"                  # Xcode 工程文件（改动噪声大，非业务代码）
    - "**/build/**"
  merge_gate:                         # merge-gate 门禁策略
    auto_merge: false                 # 本期不自动合并，仅给结论交人工拍板
    on_block: request_changes         # 有阻断项时的 review event（request_changes / comment）

# ---------------------------------------------------------------- 测试（开发/验证类 skill 用）
test:
  unit:                               # 单元测试语义配置（unit-test-authoring / unit-test-runner 按 OS 组装命令）
    ios:                               # 仅 macOS 可执行
      tool: xcodebuild
      framework: XCTest                # 各模块用 XCTest / swift-testing；单测在各 SPM 模块的 Tests target 内
      # 单测组织：本仓库单测分散在各 SPM 模块（Module/ios-dragon-*/Tests/），主壳 DragonAppTests 仅占位、勿用；
      # 每个模块是独立 SPM 包，scheme=packageName，须在该模块目录内执行 xcodebuild（package_dir）。
      # Harness CI（.harness/.../iOS_Dragon_App）只做 Archive/Sign/Upload，不跑单测——单测由本 skill 在本地/Agent 执行。
      test_style: spm_module_scheme    # iOS 单测执行样式：按被测模块 scheme（区别于主壳单 target）
      destination: "platform=iOS Simulator,name={simulator}" # {simulator} 由 unit-test-runner 代入本机可用模拟器名，不写死型号（各机 Xcode/模拟器版本不同）
      modules_discovery:               # 模块清单由 unit-test-runner 运行时从各 SPM 包推导，不手工维护（避免与代码脱节）
        glob: Module/ios-dragon-*/Package.swift # 扫描范围：每个匹配的目录即一个候选 SPM 模块
        scheme_from: packageName       # scheme = 该 Package.swift 里 `let packageName = "..."` 的值（目录名 ≠ 包名，必须读文件）
        test_target: "{scheme}Tests"   # test_target 命名恒为 包名+Tests（本仓库统一约定）
        include_if: has_test_target    # 纳入条件：Package.swift 声明了 .testTarget（无测试 target 的模块自动排除，如 keys/uitest）
        package_dir: "{glob_dir}"      # package_dir = 命中 glob 的模块目录（xcodebuild 在此目录内执行）
      # skill 组装（在 package_dir 内）：xcodebuild test -scheme {scheme} -destination '{destination}' -only-testing:{test_target}/{测试类}
      # only-testing 限定到本次改动的测试类，绕开同 target 内其他历史坏测试（XCTest 会编译整个 test target，任一文件编译不过即整体失败）
    android:
      tool: gradle                     # skill 按 OS 选 ./gradlew 或 gradlew.bat
      framework: JUnit                 # 覆盖率随单测一步产出：PR 门禁与 sonar 均用 jacocoCoverage（jacoco）
      tasks: [jacocoCoverage]           # jacocoCoverage 内部依赖 testOneTstDebugUnitTest（gradle/jacoco.gradle 选含 "tst" 的 flavor=oneTstDebug）；注意 gradle 会编译整个 test 源集，任一测试文件编译不过即整体失败
  coverage:                           # 覆盖率口径（unit-test-runner 汇总用）
    enabled: true                      # 是否统计并展示覆盖率（Android jacoco→sonar，projectKey=bmad）
    min_line: 0                        # 门禁阈值：0=只报告不卡门禁；>0=低于阈值判未通过（与 enabled 职责正交）
  stack: [appium, pytest]             # 预留（当前无开发/验证类 skill 消费）：自动化测试栈，供未来 Test Agent 接入
  regression_cases: 600               # 预留（当前无开发/验证类 skill 消费）：回归用例规模参考

# ---------------------------------------------------------------- 产物语言
doc:
  body_language: en-US
  ac_language: en-US
  scope_dimensions: [Android, iOS]   # PRD Scope 章节的分块维度＝本团队交付的端；APP 团队交付 Android/iOS 两端


team: APP
display_name: APP 团队

mcp:
  jira:
    host: https://marriottcloud.atlassian.net
    project_key: CNAPP
    issue_type: "故事"
    initial_status: backlog
    agile_team: "Team Lóng"          # 建单默认 Agile Team：所有 CNAPP scrum 团队接的票必选 Team Lóng
    labels:                          # 标签枚举，来源见 source；大小写敏感
      source: "https://marriottcloud.atlassian.net/wiki/spaces/DBU4/pages/3386999508"
      case_sensitive: true
      auto_fill: [business_domain, platform, ai_provenance]   # 允许自动填充的类别；未列出的仅作合法值校验
      ai_provenance:                 # 溯源标签：凡经 agent 创建/同步的 Jira，建单时恒定自动打上
        auto_apply: always           # 无条件添加，不依赖需求内容
        select: unique
        values: [AIGenerated]        # 固定值（无空格：Jira label 不允许空格，否则会被拆成两个标签）
      business_domain:               # 必填、单选：CNAPP 的票必须打这四个之一，否则会被过滤掉
        mandatory: true
        select: unique
        filter_gate: true            # 缺失即被下游过滤：建单前硬门禁，缺一即停
        values: [Commerce, Loyalty, Trips, Platform]   # Content 已并入 Loyalty
        # 域判定（分层降级，最终以 Story 功能性质校验，不盲从任一信号）：
        #  1) Epic 自身有 business_domain 标签 → 默认继承为该域（最权威），但单张 Story 功能性质明显不同可偏离
        #  2) Epic 无标签 → 参考同 Epic 兄弟 Story 的多数域作为推测；与多数不一致时提示为异常待确认（如兄弟均 Commerce 却标 Trips）
        #  3) 仍不足 → 回到 labels.source 官方页面的域定义，按 Story 功能性质判定
        # 判定依据不在本地固化域含义；命中多条时取最贴近核心价值的一条，不凭标题字面直觉。
      platform:                      # 平台标签：与 Component 平台规则联动，iOS 专属票必打 iOS 标签
        mandatory: true
        select: unique               # 单端票取该端；跨端票由建单人显式判定
        filter_gate: false           # 非过滤门禁，但属 iOS 专属票的必填项（见 platform_binding）
        values: [iOS, Android]
        platform_binding: components.platform_rule   # 与 Component 规则同源：Component=iOS 的票，platform 标签必为 iOS
      process_labels:                # 过程标签，仅校验、不自动填
        auto_fill: false
        values: [AdhocRequest, UnplannedSprintTicket, CrossSprintTicket, CrossSprintCommitted, DevOnly, QAOnly, Compliance, NoCodeChanges, BugReviewed, Design, VQA, StoryBug, RegressionBug, ProdKnownIssue, ProdIncident, BugPriorityUpdated]
    components:                      # Jira Component 字段规则（CNAPP）
      platform_rule:
        ios_only: iOS                # 仅 iOS 专属的票：Component 选 iOS
        android: none                # Android 票：不选任何 Component
        note: "只有 iOS 专属票选 Component=iOS；Android 票不选 Component。跨端/无关平台的票按需留空。同时按 labels.platform 规则打上对应平台标签（iOS 专属票必打 iOS 标签）。"
    links: [prd, figma, tech_solution]

  confluence:
    base_url: https://marriottcloud.atlassian.net/wiki
    space: CMI
    parent_pages:
      # 文件夹模式（当前）：一级根目录「Mobile Team Requirement Materials」folder 页 ID。
      # 发布脚本在此根下自动建/找 {initiative} → {epic} → {epic}-PRD / {epic}-Tech Solution。
      # {initiative} 取 Epic 的父级 Jira key（Initiative/计划，如 PORT-1301）；{epic} 取 Jira Epic key（如 CNAPP-5661）。
      # {initiative} 与 {epic} 夹标题由脚本查 Jira 摘要拼为「key-摘要」（如 CNAPP-5661-会员权益重构），
      # 幂等查重按 Jira key 前缀匹配，摘要文案变动不会重复建夹。
      root: "4198957209"             # 一级根目录页 ID（Mobile Team Requirement Materials，prod/CMI，folder 类型）
      # 旧模式回退（直接父页，仅当未走文件夹模式时使用）：
      prd: "4191912061"
      tech_solution: "4192731190"
    folder_layout:                   # 文件夹层级约定（供 skill 说明用；实际由脚本 --root/--initiative/--epic/--kind 落地）
      level1: "Mobile Team Requirement Materials"   # 一级：固定根目录（即 parent_pages.root）
      level2: "{initiative}"                        # 二级：Initiative（Epic 父级）夹，标题「key-摘要」，无父项时省略
      level3: "{epic}"                              # 三级：Epic 夹，标题「key-摘要」，如 CNAPP-5661-会员权益重构
      level4_prd: "{epic}-PRD"                      # 四级：PRD 归档夹
      level4_tech_solution: "{epic}-Tech Solution"  # 四级：技术方案归档夹
    naming:                            # 标题前缀（唯一键=前缀+Jira key）；脚本自动追加「-Jira 摘要」为可读尾巴，日期/版本不进标题
      prd: "APP-PRD-{epic}"
      tech_solution_prd: "APP-TS-Prd-{epic}"
      tech_solution_spike: "APP-TS-Spike-{spike_key}"
      tech_solution_detail: "APP-TS-Detail-{story_key}"
    content_format: markdown

  github:                              # GitHub（自建 GHES）连接 scope；开发/验证类 skill 的 MCP 读写落点
    host: git.marriott.com             # 自建 GHES 域名
    org: cnexperience                  # 组织/所有者（owner），四个仓库同 org
    repos:                             # 交付的代码仓库（每端一个）；base=各仓库真实基线分支（两端不同）
      ios:     { repo: cnexperience/ios-dragon-app,     base: develop }
      android: { repo: cnexperience/android-dragon-app, base: dev }
    # 兼容旧引用：单一 default_branch 已废弃，基线分支改由 repos.*.base 提供（每仓库不同）

# ---------------------------------------------------------------- 代码工程（开发/验证类 skill 用）
code:
  languages: [swift, kotlin]           # 语言栈：iOS=swift / Android=kotlin
  # 分支命名：唯一 AI Feature 分支模板；{story_key}=Jira Story key，{slug}=Story 摘要短横线化
  branch:
    prefix: ai/feature                 # AI 专属分支前缀，与人工分支隔离
    template: "ai/feature/{story_key}-{slug}"
  build:                              # 每端的编译/构建命令（build-verify 用），按 repo 键区分；命令口径对齐各仓 CI
    ios:
      tool: xcodebuild                 # xcodeproj（非 workspace），scheme DragonApp；iOS CI（harness）只做 Testflight 打包，构建校验本地用 xcodebuild
      command: "xcodebuild -project DragonApp.xcodeproj -scheme DragonApp -destination 'generic/platform=iOS' build"
    android:
      tool: gradlew                    # gradle 8.11.1；PR 门禁 flavor=oneTst（见 PRValidation.yml）
      command: "./gradlew clean assembleOneTstDebug"
      static_check: "./gradlew clean detektAll"   # PR 门禁的静态检查是 detekt（非普通 lint），build-verify 可一并跑
  contract:                           # contract-diff 口径：接口契约以技术方案 detail 的接口定义为基线
    source: tech_solution_detail       # 契约基线来源：Story 级明细方案的接口定义章节
    match: field_level                 # 比对粒度：逐字段（Swift 看 Codable/CodingKeys；Kotlin 看 data class/注解）

# ---------------------------------------------------------------- 代码审核（代码审核类 skill 用）
review:
  rules_source: TBD                   # code-review-rules 用：APP 团队编码规范来源（Confluence 规范页 URL/ID 或仓库内规范文件路径）；待补，缺失时 skill 停下要求补齐，不臆造规范
  security_baseline: null             # 可选：安全基线来源；缺省用 skill 内置通用安全基线
  ignore_globs:                       # diff-fetch 免审文件：生成物/锁文件不纳入审核上下文
    - "**/Package.resolved"           # SPM 锁文件
    - "**/*.pbxproj"                  # Xcode 工程文件（改动噪声大，非业务代码）
    - "**/build/**"
  merge_gate:                         # merge-gate 门禁策略
    auto_merge: false                 # 本期不自动合并，仅给结论交人工拍板
    on_block: request_changes         # 有阻断项时的 review event（request_changes / comment）

# ---------------------------------------------------------------- 测试（开发/验证类 skill 用）
test:
  unit:                               # 单元测试框架与执行命令（unit-test-authoring / unit-test-runner 用）；对齐 CI
    ios:
      framework: XCTest                # 测试 target：DragonAppTests（单测）/ DragonAppUITests（UI）
      command: "xcodebuild test -project DragonApp.xcodeproj -scheme DragonApp -destination 'platform=iOS Simulator,name={simulator}' -only-testing:DragonAppTests"  # {simulator} 由 unit-test-runner 运行时代入本机可用模拟器名，不写死型号（各机 Xcode/模拟器版本不同）
    android:
      framework: JUnit                 # 覆盖率随单测一步产出：PR 门禁与 sonar 均用 jacocoCoverage（jacoco）
      command: "./gradlew jacocoCoverage"
  coverage:                           # 覆盖率口径（unit-test-runner 汇总用）
    enabled: true                      # 是否统计并展示覆盖率（Android jacoco→sonar，projectKey=bmad）
    min_line: 0                        # 门禁阈值：0=只报告不卡门禁；>0=低于阈值判未通过（与 enabled 职责正交）
  stack: [appium, pytest]             # 预留（当前无开发/验证类 skill 消费）：自动化测试栈，供未来 Test Agent 接入
  regression_cases: 600               # 预留（当前无开发/验证类 skill 消费）：回归用例规模参考

# ---------------------------------------------------------------- 产物语言
doc:
  body_language: en-US
  ac_language: en-US
  scope_dimensions: [Android, iOS]   # PRD Scope 章节的分块维度＝本团队交付的端；APP 团队交付 Android/iOS 两端

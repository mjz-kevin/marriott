# ============================================================
# Test Case Memory 记忆库 —— 用户 scenario 步骤拆解习惯沉淀
# ------------------------------------------------------------
# 职责：在「用户写的 scenario 步骤并不完善」（高层/笼统/省略中间操作）的情况下，
# 保证 AI 仍能按用户习惯【更精确地拆分出实现逻辑】——即某条高层 step 到底该展开成
# 哪些具体 UI 子操作、以什么顺序做。解决的是「读懂用户意图、正确拆步」的问题。
#
# 与 test_script_memory.yaml 的区别（务必分清）：
#   - test_case_memory.yaml（本文件）：理解层 / 步骤拆解。
#       目标 = 在 scenario 不完善时，精确还原用户想要的实现逻辑（拆成哪几步、什么顺序）。
#   - test_script_memory.yaml：实现层 / 代码跑通。
#       目标 = 生成脚本时，代码逻辑能稳定跑通（等待 / 定位 / 断言 / 稳定性等通用技术规则）。
#   一句话：本文件管「拆得对不对（懂不懂用户）」，另一份管「代码跑不跑得通」。
#
# 主要消费方 Skill：
#   .cursor/skills/test-case-to-script （伪代码/feature step → 可执行脚本）
#   —— 落地某条 step 前先读本文件：若 step 写得笼统且命中某条 step_pattern，
#      就按记录的 breakdown 顺序精确拆分实现，避免把高层 step 误当成单步操作。
#   （test-case-authoring 生成伪代码时也可参考，让编号步骤明细贴合用户习惯。）
#
# 何时追加：当用户表达“这类（写得不完善的）step 我其实是想这样拆/这样做”时，
# 抽象成一条 pattern 追加进来；只针对单个元素的临时定位不写这里（那属于 Page Object）。
#
# 条目字段：
#   id          : 唯一编号，递增（CASE_001, CASE_002 ...）
#   scope       : 适用范围 iOS | Android | CrossPlatform | All
#   skill       : 主要消费该规则的 skill（默认 test-case-to-script）
#   step_pattern: 命中的高层/不完善 step（英文，允许含 <参数> 占位，如 <location>）
#   intent      : 这条 step 的真实业务意图（一句话）
#   breakdown   : 用户习惯的精确拆解子步骤（有序列表，每步一句话；元素定位以真机
#                 Page Object 为准，这里只描述“做什么/顺序”，不写死 locator）
#   example     : 来源示例（feature 路径:行号 或 Jira Key）
#   rationale   : 为什么这样拆（来龙去脉 / 用户偏好 / 原 scenario 缺了什么）
# ============================================================

# ------------------------------------------------------------
# 测试目标（test_target）：告诉 jira-to-test-case（及 ai-test-agent）当前用例设计的测试目标属于 app 还是 cms。
#   app —— 移动端 App（iOS 优先）：走 jira-to-test-case 现有完整 app 流程；下游 authoring→to-script→debug 主线亦为 app 专用。
#   cms —— CMS（内容管理系统）：由 jira-to-test-case 内「CMS test target」小节承接（与 app 对称，流程完整可用）；下游 authoring→to-script→debug 仍为 app 专用，cms 仅到用例设计 + 发布。
# 说明：本项目 6 个 skill 中只有 jira-to-test-case 需区分 app/cms，其余 5 个为纯 app 流程。
# 优先级：上游 Agent 传入 > 用户对话显式指明 > 本字段（默认值）。缺失/冲突无法判定时先问用户。
test_target: app  # 默认测试目标：移动端 App（iOS 优先）
# ------------------------------------------------------------

cases:  # 步骤拆解案例列表（按 id 递增追加）
  - id: "CASE_001"  # 案例编号 001
    scope: "iOS"  # 适用范围：iOS 端
    skill: "test-case-to-script"  # 主要消费方 Skill
    step_pattern: "When find hotel by location=<location>"  # 命中的笼统 step 模式（英文）
    intent: "On the home screen, search for hotels by destination and land on the property list page; tapping the「Find hotels」button is the required entry into the property list page."  # 业务意图：首页按目的地搜酒店并进入列表，必经「查找酒店」
    breakdown:  # 用户习惯的精确子步骤顺序
      - "Tap the location/destination control on the home screen to open the destination sheet."  # 子步骤1：点首页地点/目的地，打开目的地弹窗
      - "In the destination sheet, select the destination card that matches <location>."  # 子步骤2：在弹窗中选与 <location> 匹配的目的地卡片
      - "Tap「Find hotels」to run the search — this is the only entry into the property list page. The step must explicitly tap it and confirm navigation to the list; never skip, assume the list is already shown, or omit this tap."  # 子步骤3：点「查找酒店」并确认已进入酒店列表，不可省略
    example: "tests/mobile/ios/features/CNAPP-383.feature:24"  # 来源示例：feature 文件与行号
    rationale: "The original scenario only had a vague「find hotel by location」and omitted intermediate UI steps. The intended flow is: tap destination → pick card in sheet → tap Find hotels. Locators come from real-device collection into Page Objects. Pitfall: failing to actually tap「Find hotels」left the flow on the home screen, so「the property list page is displayed」always failed. Lesson: Find hotels is the mandatory sole entry to the property list; find-hotel steps must wait for list navigation before the step is considered done."  # 拆解原因：原 scenario 太笼统；未点查找酒店导致列表页断言失败

  - id: "CASE_002"  # 案例编号 002
    scope: "iOS"  # 适用范围：iOS 端
    skill: "test-case-to-script"  # 主要消费方 Skill
    step_pattern: "On any list/selection screen, select or act on a target item when Examples hard-code object name/spec (e.g. property=<hotel name>, room=<room type such as「Guest room, 1 king」>), but the case goal does not depend on that item's identity (flow-through / field copy only). Exception: rate (e.g.「Flexible rate」) is identity-sensitive — keep explicit selection per rationale."  # 命中模式：列表选对象但身份无关时动态化；rate 例外保留写死
    intent: "When the operated object's identity does not matter for assertions, drop hard-coded names/specs and use「capture first list card at runtime + reuse dynamically」for property, room, and similar list levels. Rate is the exception: keep Examples rate and assert against the chosen rate name."  # 意图：取第一张 card + 运行时动态断言；房价 rate 仍显式选择
    breakdown:  # 动态化拆解步骤
      - "Remove Examples columns that hard-code identity-irrelevant names/specs (property, room, etc.); keep columns that assertions truly need (including rate)."  # 删除 Examples 中与断言无关的写死列，保留 rate 等
      - "After「that list level is displayed」, add「capture the first card's info into runtime context」(stable locator at index=0 for name/spec such as hotel or room type)."  # 列表展示后捕获 index=0 的 card 信息到运行时上下文
      - "Replace「scroll to find <name/spec>」and「tap <name/spec>」with「tap the first card (index=0, not by name/spec)」."  # 用点第一张 card 替代按名字滚动查找
      - "Rate exception: keep the rate column in Examples; on the room step use the first room card (dynamic) plus explicit rate=<rate> (e.g.「Flexible rate」). Before selecting rate, tap the expand control beside the room price (bottom-right chevron) so rate options appear, then tap the target rate; review-page rate assertions use the hard-coded rate; property/room use captured values."  # rate 例外：先展开房价列表再选写死的 rate；酒店/房型用捕获值
      - "On downstream pages (detail, rate, review, confirmation, etc.), compare property/room and other identity-irrelevant fields to captured runtime values, not Examples constants."  # 下游页面对酒店/房型等与捕获值比较
      - "Before text assertions, normalize per RULE_008 (trim/extra whitespace, consistent format)."  # 文本断言前按 RULE_008 归一化
    example: "tests/mobile/ios/features/CNAPP-383.feature (property column removed; capture the first property name + click the captured first property name; downstream uses in the captured ... page; room handled like property — first room card dynamic; rate kept in Examples: select the captured first room card and rate=<rate>; review: in the captured property room and rate=<rate> reservation review page)"  # CNAPP-383 动态化示例
    rationale: "User asked to use the first list hotel instead of a fixed name, then the first room card the same way — the case validates Guest Info optional copy and booking flow, not a specific hotel or room. Pattern: for identity-irrelevant list picks at any level, use first card + dynamic assertions. User clarified rate (e.g. flexible change policy) must stay explicit in Examples and assertions because rate affects terms. Do not dynamicize when assertions depend on a specific property, room, or rate."  # 用户要求第一张酒店/房型；rate 因退改政策需保留写死

  - id: "CASE_003"  # 案例编号 003
    scope: "iOS"  # 适用范围：iOS 端
    skill: "test-case-to-script"  # 主要消费方 Skill
    step_pattern: "When input required fields on reservation review guest info page (or any step that fills required fields on Guest Info without listing exact values)"  # 命中：Guest Info 填必填项但未给具体值
    intent: "When filling only required fields on Guest Info, use the preset test data below; leave optional fields (Address Line 1, City, etc.) empty."  # 意图：必填用预置数据，可选项留空
    breakdown:  # Guest Info 预置填写步骤
      - "Name (first/last or single field): use auto test (first=auto, last=test; or single field「auto test」)."  # 姓名：auto / test 或 auto test
      - "Mobile: +86 15500000000 (country +86, number 15500000000)."  # 手机：+86 15500000000
      - "Email: autotest@marriott.com."  # 邮箱：autotest@marriott.com
      - "Optional fields (Address Line 1, City, etc. marked optional): leave empty."  # 可选字段（地址、城市等）不填
      - "After filling, tap Save to return to the reservation review page."  # 填完点保存回到评审预订页
    example: "tests/mobile/ios/features/CNAPP-383.feature (input required fields on reservation review guest info page)"  # 来源：CNAPP-383 Guest Info 步骤
    rationale: "User specified this fixed Guest Info preset for guest booking required fields. Reuse for any「fill Guest Info required fields」step without per-case invented data. Input locators still come from Page Objects on real device."  # 统一预置数据，跨用例一致；定位符仍来自 Page Object

  - id: "CASE_004"  # 案例编号 004
    scope: "iOS"  # 适用范围：iOS 端
    skill: "test-case-to-script"  # 主要消费方 Skill
    step_pattern: "PRD/case precondition uses a user tag (e.g.「logged in as Silver/Gold/Platinum/Ambassador/Titanium member…」,「as <tier> user…」,「already logged-in <tier> user…」), or any precondition that requires logging in with a given identity first."  # 命中：以会员标签/身份登录为前置
    intent: "Treat「log in as user tag」as a fixed login precondition: map tag to env credentials, run the unified login UI chain, yield logged-in state for downstream steps. Only the tag (which account) varies."  # 意图：固定登录流程模板，仅切换标签对应账号
    breakdown:  # 登录前置拆解（理解层，实现见 RULE_025）
      - "Parse member/tier tag from PRD/case; map to env credentials (e.g. PLATINUM_USER_ACC_NO/PWD, AMBASSADOR_USER_ACC_NO/PWD from .env.ios.lle). Default LOGIN_USERNAME/LOGIN_PASSWORD when only generic login is needed. Never write real credentials into feature/steps/pre_code."  # 标签映射 env 账号，禁止写死密码到 feature
      - "If env lacks variables for that tag, ask the user to add *_ACC_NO/*_PWD in .env.ios.lle — do not invent or hard-code."  # 缺变量时提示用户补 .env，不编造
      - "Open login: on account tab tap Sign in / Activate (logged-out)."  # 账户 tab 点登录/激活入口
      - "Confirm login form (account field / signInButton visible)."  # 确认登录表单已显示
      - "Enter credentials and submit (hide keyboard before tap — RULE_024; implementation template RULE_025)."  # 输入账号密码并提交，先收键盘（RULE_024/025）
      - "Confirm success: switch to account tab; assert logged-in marker (e.g. accountName) and logged-out Sign in / Activate gone. That state is the shared precondition for business steps."  # 断言已登录标志出现且未登录入口消失
    example: "tests/mobile/ios/features/full_login_flow.feature; account mapping in conftest PlatinumUser/AmbassadorUser and ios_test_config.get_login_account()"  # 来源：full_login_flow 与 conftest 账号映射
    rationale: "User defined login as a fixed flow: PRD tags map to env accounts as one precondition producing logged-in state. Understanding layer for any「log in as identity」precondition; pairs with RULE_025 (implementation template). This case covers how to break down and which account source; RULE_025 covers how the script runs reliably."  # 理解层拆步 + 账号来源；与 RULE_025 实现模板配套

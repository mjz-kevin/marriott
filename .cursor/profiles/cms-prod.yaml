
team: CMS
display_name: CMS 团队

mcp:
  jira:
    host: https://marriottcloud.atlassian.net
    project_key: GCD
    issue_type: "故事"
    initial_status: BACKLOG
    workflow: ["BACKLOG", "待办", "TDD", "正在进行", "审查", "DEPLOY", "已完成"]   # GCD 故事(Story)真实工作流状态序列（名称逐字对齐 Jira；待办/正在进行/审查/已完成为本地化显示名）；dev-agent push 成功后向前流转
    agile_team: "CN CMS Squad"   # 建单默认 Agile Team
    labels:                # CMS 无 business_domain 等枚举门禁，其余标签人工填写
      case_sensitive: true
      auto_fill: [ai_provenance]
      ai_provenance:       # 溯源标签：凡经 agent 创建/同步的 Jira，建单时恒定自动打上
        auto_apply: always # 无条件添加，不依赖需求内容
        select: unique
        values: [AIGenerated]   # 固定值（无空格：Jira label 不允许空格，否则会被拆成两个标签）
    links: [prd, figma, tech_solution]
    figma_embed:                     # Figma UI 设计在工单里的落地方式：link=仅可点击链接（历史默认）；embed=链接 + 把设计节点导出为 PNG 作附件内嵌进描述
      mode: embed                    # embed=建单时导出 Figma 节点为 PNG、上传为 Jira 附件、以 ADF media 内嵌进描述（经 Jira REST，MCP-only 的受控例外）；link=退回仅链接
      png_scale: 1                   # 导出 PNG 的缩放倍数（download_figma_images 的 pngScale）；工单内嵌 1x 已够看清，2x 体积约 4 倍、上传更慢
      max_height_px: 2400            # 待导出节点高度（Figma 设计稿尺寸，单位 px）上限；超过即判定为整页长图，不导出，改为推荐卡片 / 屏级子节点让用户确认
      heading: "UI Design"           # 内嵌图片前插入的描述标题段文字
    bug:                             # test-run-report-bug 建 Bug 配置（自动化失败建单 / 手动建单共用）
      project_key: CNAPP             # Bug 所在项目（与顶层 project_key 一致，显式留存便于演进）
      issue_type: "缺陷"             # Bug issue type（id 10007）
      domain_values: [Commerce, Loyalty, Trips, Platform]   # Domain 自定义字段取值；与 labels.business_domain.values 同源，勿两处漂移
      severity_default: "3-Medium"   # customfield_10136 默认档，可按严重度上下调
      environments: "Test"           # customfield_10042（建单必填），自动化属测试环境
      replication_steps_field: customfield_10086   # Replication Steps 字段
      severity_field: customfield_10136
      environments_field: customfield_10042
      regression_story: CNAPP-7206   # 每个 Bug 用 Blocks 链到的回归缺陷收集 Story
      link_type: Blocks              # 链接类型（Bug Blocks -> regression_story）

  confluence:
    base_url: https://marriottcloud.atlassian.net/wiki
    space: CMI
    parent_pages:
      # 文件夹模式（当前）：一级根目录「CMS Team Requirement Materials」folder 页 ID。
      # 发布脚本在此根下自动建/找 {initiative} → {epic} → {epic}-PRD / {epic}-Tech Solution / {epic}-TestCase。
      # {initiative} 取 Epic 的父级 Jira key（Initiative/计划，如 GCD-359）；{epic} 取 Jira Epic key（如 CNAPP-5661）。
      # {initiative} 与 {epic} 夹标题由脚本查 Jira 摘要拼为「key-摘要」（如 GCD-359-内容中台重构），
      # 幂等查重按 Jira key 前缀匹配，摘要文案变动不会重复建夹。
      root: "4175954245"             # 一级根目录页 ID（CMS Team Requirement Materials，prod/CMI，folder 类型）
      # 旧模式回退（直接父页，仅当未走文件夹模式时使用）：
      prd: "4175954245"
      tech_solution: "4175954245"
    folder_layout:                   # 文件夹层级约定（供 skill 说明用；实际由脚本 --root/--initiative/--epic/--kind 落地）
      level1: "CMS Team Requirement Materials"      # 一级：固定根目录（即 parent_pages.root）
      level2: "{initiative}"                        # 二级：Initiative（Epic 父级）夹，标题「key-摘要」，无父项时省略
      level3: "{epic}"                              # 三级：Epic 夹，标题「key-摘要」，如 CNAPP-5661-会员权益重构
      level4_prd: "{epic}-PRD"                      # 四级：PRD 归档夹
      level4_tech_solution: "{epic}-Tech Solution"  # 四级：技术方案归档夹
      level4_test_case: "{epic}-TestCase"           # 四级：cms 功能用例归档夹（与 PRD / Tech Solution 平级，jira-to-test-case 的 cms 目标用，--kind test_case）
    naming:                            # 标题前缀（唯一键=前缀+Jira key）；脚本自动追加「-Jira 摘要」为可读尾巴，日期/版本不进标题
      prd: CMS-PRD-{epic}
      tech_solution_prd: CMS-TS-Prd-{epic}
      tech_solution_spike: CMS-TS-Spike-{spike_key}
      tech_solution_detail: CMS-TS-Detail-{story_key}
    content_format: markdown
    test:                              # 测试线各 Confluence 落点（test-page-elements / test-run-report-bug 用；功能用例已改走 folder 模式见上）
      # 知识库（app_doc / page_doc / cms_doc / cms_page + 两个导航页）、memory 页、运行报告根均在 DBU4 空间（test/prod 共用同一套知识库）；
      # 本节 space 即 DBU4。
      # cms 功能用例不落本节——它改走需求/方案线 folder 模式（见上方 confluence.parent_pages.root + folder_layout.level4_test_case），
      # 与 {epic}-Tech Solution 平级落在 {epic}-TestCase 夹（prod 需求线 space=CMI）。
      space: "DBU4"                    # 测试线知识库 / memory / 运行报告所在 space（DBU4）
      space_id: "329154959"            # DBU4 space 的数字 ID
      cloud_id: "627b9bb1-1899-4ff6-bc6e-066cf136a066"
      folders:                         # 发布脚本 --parent 的目标 folderId
        app_doc:     "4260299195"      # app 页面元素知识库根 folder（内含 page_doc + iOS 导航页；对称于 cms_doc）
        page_doc:    "4280157634"      # app 页面元素文档（iOS Page Elements - ...），在 app_doc 下
        cms_doc:     "4281205569"      # cms README + 导航页所在 folder（cms 知识库根）
        cms_page:    "4281827573"      # cms 模块文档 folder，在 cms_doc 下
        report_root: "4192207633"      # 运行报告根 folder「Automation Report」(DBU4)；运行时先问用户平台+版本号，在其下找/建二级夹「<iOS|Android> <版本号>」(如 iOS 26.8 / Android 11.15)，报告页落入该二级夹
      nav_pages:                       # 活数据导航页（运行时读写，非发布 folder）；均在 DBU4
        app_page_map:   "4280157316"   # iOS Page Map & Inventory 导航页（在 app_doc 下）
        cms_module_map: "4280551711"   # CMS Module Map & Inventory 导航页（在 cms_doc 下）
      memory_pages:                    # 两个记忆库 Confluence 页（DBU4 空间 folder 4363354130），skill 从这里读/写
        folder: "4363354130"
        test_case:   "4364632091"      # test-case-memory 页（步骤拆解案例库）
        test_script: "4364992536"      # test-script-memory 页（通用技术规则库）

  github:                              # GitHub（自建 GHES）连接 scope；开发/验证类 skill 的 MCP 读写落点
    host: git.marriott.com             # 自建 GHES 域名
    org: cnexperience                  # 组织/所有者（owner），与 APP 同 org
    repos:                             # 交付的代码仓库；base=各仓库真实基线分支
      cncms:      { repo: cnexperience/cncms,                 base: main }   # Payload CMS + Next.js
      monorepo:   { repo: cnexperience/cn-frontend-monorepo,  base: main }   # Nx monorepo（didi / member-day / legal-page 等 app）
    # 兼容旧引用：单一 default_branch 已废弃，基线分支改由 repos.*.base 提供

  harness:                             # Harness 连接 scope；harness-invoke（CI/CD 环节）触发流水线并查执行状态的落点。
    base_url: https://marriott.harness.io   # Harness 实例地址（UI URL 前缀；skill 可用 url 快捷方式让 MCP 自动抽取 scope）
    org_id: cnexperience                    # Harness Organization 标识（MCP 调用必传）
    project_id: cncms                       # Harness Project 标识（CMS；MCP 调用必传）
    # account_id 与 API 凭据不写在此处：二者均从 MCP 配置（mcp.json → harness 服务的 env）读取，
    # 保持单一事实来源，也避免凭据与账号标识随 profile 进入版本库。
    #
    # 本节只记录「人的决策」：哪条流水线属于本团队交付路径、哪些环境在范围内、哪条禁止 agent 触发。
    # 不记录可从 Harness 查到的事实（入参规格与默认值、取值域、input set、stage 结构、
    # 环境→stage 子集、service/infra 取值）——那些一律由 harness-invoke 在触发前运行时读取，
    # 以 Harness 为唯一权威来源。手抄这些会产生两份真相：配置一旦滞后，skill 会拿过期规格
    # 去跟使用者确认参数，比没有规格更危险。
    #
    # 范围收口：本工具链的 CI/CD 环节只发布低环境（dev / test）。高环境（stg / prod，以及 uat 等
    # 其它非低环境）一律不触发，也没有「人工确认后放行」的通道——由人在 Harness UI 操作。
    # CMS 的流水线多为晋级链（一条定义里 test → stg → prod 串行），目标环境由「跑哪些 stage」决定，
    # 故这里仍登记整条流水线，范围由 allowed_envs + stage 子集共同收口。
    pipelines:                         # 交付流水线清单；CMS 按 app 唯一定位。
                                       # 未登记 = 不可触发（skill 遇无匹配即停止，不猜），故检查/沙箱类无需在此列出。
                                       #
                                       # ⚠️ 以下两条刻意不登记，**新增条目时不要把它们加进来**（危险性从名称完全看不出）：
                                       #   · utility —— environmentRef / serviceRef 均为无默认值、无取值域的自由输入
                                       #     （可填 prod），且 action=delete 会执行 K8sDelete 删除集群资源；
                                       #     其审批步骤条件是 env.type == Production，故低环境跑 delete 毫无门禁。
                                       #     即「发到低环境」也不能让它安全——它的风险在能做什么，不在发到哪。
                                       #   · HARNESS_STO_REMEDIATION_PLACEHOLDER —— STO 动态执行占位壳
                                       #     （allowDynamicExecutions: true）：本体只有一个 noop 脚本，但运行时 YAML
                                       #     可被完全覆盖，等同任意流水线执行入口；由 STO 平台驱动，非团队交付路径。
                                       # 另两条未登记是因为用不到：cncms_cicd_custom（已被 _migration 取代）、
                                       # cncms_integrity（检查类）。
      - { id: cncms_cicd_custom_migration, app: cncms,            repo: cncms }       # cncms 主部署，团队实际在用
      - { id: DiDiCICDFE,                  app: didi,             repo: monorepo }
      - { id: MBYCICDFE,                   app: mby,              repo: monorepo }
      - { id: CampUtilitiesCICDFE,         app: camp-utilities,   repo: monorepo }
      - { id: PaymentConsoleCICD,          app: payment-console,  repo: cnconsoles }  # 该仓未登记在 github.repos
      - { id: memberdaycicd,               app: member-day,       repo: monorepo }
      - { id: legalpagedeploy,             app: legal-page,       repo: monorepo }
      - { id: cncmsossuploadjobdeploy,     app: cncms-oss-upload, repo: cncms }
      - { id: CDONLY,                      app: travelpartner,    repo: null }        # CD-only，无 CI 阶段
    allowed_envs: [dev, test]          # 允许触发的环境白名单（低环境），用真实 environment identifier
                                       # （cncms 项目共 5 个：dev / test / stg / perf / prod）。
                                       # 判定依据是本次触发实际打向哪个环境（晋级链即 stage 子集对应的环境，
                                       # 或某个入参取值点名的环境），不是流水线名称或标签；
                                       # 不在白名单内（stg / perf / prod）→ skill 直接停止并提示去 Harness UI，
                                       # 没有人工确认放行通道。
    allow_stage_execution_fallback: true   # 允许 harness-invoke 在 MCP 无法限定 stage 子集时，改用其随附的
                                       # stage 子集封装触发晋级链流水线（见 skill 文档）。置 false 则一律改由人在 UI 触发。
    security_readout: true             # 执行结束后读安全扫描结果（security-findings）：CMS 流水线含 org.CICD 扫描步骤组
                                       # （Aqua / Gitleaks / Sonar / hadolint / Base Image Check / CAP）。缺省 = true。
    poll:                              # 触发后等待执行状态的口径
      mode: server_wait                # 优先用 MCP 的服务端阻塞等待（wait=true），而非 LLM 轮询循环
      timeout_seconds: 3600            # 等待总超时（server_wait 上限 7200）；超时回报「仍在运行」并给句柄，不判成败
      interval_seconds: 30             # 回退轮询时的间隔
# ---------------------------------------------------------------- 代码工程（开发/验证类 skill 用）
code:
  languages: [typescript]              # 语言栈：TypeScript
  # 分支命名：对齐团队 Branching Strategy 的 {KEY}-Xxx-Xxx；AI 套 prefix。{slug}=2–3 个 Title-Case 词，非整句摘要
  branch:
    prefix: feat-ai                    # AI 专属前缀，与人工 Feature（无前缀）隔离
    template: "feat-ai/{story_key}-{slug}"
  build:                              # 构建校验的语义配置（build-verify 按 OS 组装命令），按 repo 键区分；对齐各仓 CI
    cncms:                             # Next.js + payload；pnpm 10.x；precommit=generate:all && lint:tsc && build:compile
      tool: pnpm                       # 执行器；skill 分步执行 steps（不用 && 拼接，兼容 PowerShell/CMD）
      steps:                           # 逐步执行的 pnpm 参数（每步 = 一次 pnpm 调用）
        - "install --frozen-lockfile"
        - "lint:tsc"
        - "build"
    monorepo:                          # Nx monorepo；pnpm 11.x；构建校验只跑 lint/build/typecheck，单测交 unit-test-runner（职责不重叠）
      tool: pnpm-nx                    # 执行器；skill 先 pnpm 装依赖，再 pnpm exec nx（不用 npx，避免 && 与命令替换）
      steps:
        - "install --frozen-lockfile"
      nx:                              # nx 语义：skill 组装为 `pnpm exec nx run-many -t lint build typecheck`
        command: run-many
        targets: [lint, build, typecheck]
  git_hooks:                          # 各仓本地 git 钩子行为（dev-agent 提交前须知：提交会触发这些检查，提前预跑避免"撞上才知道"；非硬编码命令，仅声明语义与真实脚本来源）
    cncms:
      mechanism: husky                 # core.hooksPath=.husky/_；pre-commit 脚本调 `pnpm exec lint-staged`
      pre_commit: lint-staged          # lint-staged 对暂存文件触发链：generate:all → lint:tsc → build:compile（见 package.json 的 lint-staged 配置；提交前先跑等价检查即可通过）
      commit_msg: null                 # 无 commit-msg 钩子，提交信息格式不被本地强制
    monorepo:
      mechanism: husky                 # core.hooksPath=.husky/_；pre-commit 脚本调 `pnpm exec lint-staged`
      pre_commit: lint-staged
      commit_msg: null
  commit:                             # 提交信息约定（dev-agent D6 生成 commit message 用）；CMS 两仓无 commit-msg 钩子，遵循仓库历史的 Conventional Commits 惯例
    convention: conventional_commits   # type(scope): subject，如 feat(cms): ... / fix: ... / docs: ...
    subject_issue_tag: optional        # 历史提交多不带 issue 标注（靠 PR 关联）；带 [KEY] 溯源亦可，二者皆合规
    language: any                      # 无字符集限制（可中英）
  ai_provenance:                      # AI 辅助代码溯源标识（dev-agent D6 / create-pr 用）：落在 commit 与 PR 上，合并后仍可追溯
    commit_trailer: "AI-Assisted: Cursor dev-agent"  # 追加在 commit message 末尾的 git trailer（与正文空一行，作最后一段）；CMS 两仓无 commit-msg 钩子
    pr_label: AIGenerated             # PR 上打的 GitHub label（与 Jira ai_provenance 同名）；仓库无此 label 时不自建，提示 DEV 处理
  contract:                           # contract-diff 口径：接口契约以技术方案 detail 的接口定义为基线
    source: tech_solution_detail       # 契约基线来源：Story 级明细方案的接口定义章节
    match: field_level                 # 比对粒度：逐字段（TS 看 interface/type/zod schema；payload 看 collection field）
  extras: [payload_migration]          # 预留（当前无 skill 消费）：CMS 特有 payload migrate（cncms 的 `pnpm migration:apply`），待未来迁移校验类 skill 接入

# ---------------------------------------------------------------- 代码审核（代码审核类 skill 用）
review:
  rules_source:                       # code-review-rules 用：CMS 团队编码规范来源。扫描本地仓库得到：cncms 与 monorepo 各有 ESLint + Prettier 配置。
    kind: repo_file                   # 来源类型：confluence（团队规范页）/ repo_file（仓库内规范文件）/ github（GitHub MCP get_file_contents）/ bundled（随 code-review-rules 分发的规则包）；本节按来源就近标注。另：正确性 / 可读性 / 架构合理性三个审核视角由 skill 内置，不依赖本配置
    common:                           # 跨语言通用规范：对所有语言子键（typescript）一并适用
      - name: Marriott Naming Conventions
        kind: confluence                # 经 Atlassian(Confluence) MCP getConfluencePage 读取
        confluence:
          space: TIP
          page_id: "262439119"
          url: https://marriottcloud.atlassian.net/wiki/spaces/TIP/pages/262439119/Marriott+Naming+Conventions
        dimensions: [命名, 分层/职责]
      - name: UXL Schema Design Standards
        url: https://ui-dev-portal.fnd-uxl-test.test.cld.marriott.com/guides/schema-design-standards   # 官方 GraphQL/UXL schema 设计规范（查询/变更命名、类型前缀、可空性、错误建模、分页）
        repo_url: https://git.marriott.com/cnexperience/cncms/blob/main/docs/marriott_docs/uxl-schema-design-standards.md   # 仓库内同步的规范文件（远端地址，人人可访问）
        dimensions: [命名, 分层/职责, 异常处理]                                          # 主要适用 cncms 的 GraphQL schema 层
    typescript:                       # 两个仓库各自的仓库内规范文件
      - name: ESLint config (cncms)
        repo: cncms                   # 对应 mcp.github.repos.cncms
        path: eslint.config.mjs       # typescript-eslint recommended + Next.js + react-hooks + cspell
        url: https://git.marriott.com/cnexperience/cncms/blob/main/eslint.config.mjs
        dimensions: [命名, 分层/职责, 异常处理, 性能]
      - name: Prettier config (cncms)
        repo: cncms
        path: .prettierrc.json
        url: https://git.marriott.com/cnexperience/cncms/blob/main/.prettierrc.json
        dimensions: [命名]
      - name: ESLint config (monorepo)
        repo: monorepo                # 对应 mcp.github.repos.monorepo
        path: eslint.config.mjs       # Nx flat base/typescript/javascript + enforce-module-boundaries
        url: https://git.marriott.com/cnexperience/cn-frontend-monorepo/blob/main/eslint.config.mjs
        dimensions: [命名, 分层/职责, 异常处理, 性能]
      - name: Prettier config (monorepo)
        repo: monorepo
        path: .prettierrc
        url: https://git.marriott.com/cnexperience/cn-frontend-monorepo/blob/main/.prettierrc
        dimensions: [命名]
  ignore_globs:                       # diff-fetch 免审文件：生成物/锁文件不纳入审核上下文
    - "pnpm-lock.yaml"
    - "**/dist/**"
    - "**/*.generated.*"
    - "**/migrations/**"              # payload 迁移产物（评审看源，不看生成迁移）
  merge_gate:                         # merge-gate 门禁策略
    auto_merge: false                 # 本期不自动合并，仅给结论交人工拍板
    on_block: request_changes         # 有阻断项时的 review event（request_changes / comment）

# ---------------------------------------------------------------- 测试（开发/验证类 skill 用）
test:
  unit:                               # 单元测试语义配置（unit-test-authoring / unit-test-runner 按 OS 组装命令）；对齐 CI
    cncms:
      tool: pnpm                       # skill 组装为 `pnpm run test:unit`
      framework: vitest                # 单测 test:unit（vitest.config.unit.mts）；另有 test:int 集成、playwright e2e
      script: "test:unit"              # package.json script 名
      needs_services: [postgres, redis] # 集成/部分单测依赖 docker 服务（docker compose up -d，见 .harness/ci-test.env）；纯单测 test:unit 一般不依赖
    monorepo:
      tool: pnpm-nx                    # skill 组装为 `pnpm exec nx affected -t test --base <sha> --head HEAD`
      framework: jest                  # Nx + jest（jest.preset.js）；本地 Agent 无 Nx Cloud 分布式，用 affected 只测受 Feature 分支改动影响的 project（比 run-many 全量快）
      nx:                              # nx 语义；base_ref 由 skill 先跑 `git merge-base HEAD origin/<base>` 求出 SHA 再作为 --base 传入（分两步，不用 $() 命令替换）
        command: affected
        targets: [test]
        base_ref: "origin/{base}"      # {base} 代入 repos.monorepo.base；仅表示比较基准，非直接拼进 shell
        head_ref: HEAD
  coverage:                           # 覆盖率口径（unit-test-runner 汇总用）
    enabled: true                      # 是否统计并展示覆盖率（cncms 接 sonar，sonar-project.properties）
    min_line: 0                        # 门禁阈值：0=只报告不卡门禁；>0=低于阈值判未通过（与 enabled 职责正交）
  scope: [functional_case_authoring]  # 预留（当前无 skill 消费）：本期范围＝仅功能测试用例生成，待未来测试用例编写类 skill 接入
  automation: false                   # 预留（当前无 skill 消费）：本期不做自动化执行
  regression: false                   # 预留（当前无 skill 消费）：本期不做回归

# ---------------------------------------------------------------- 产物语言
doc:
  body_language: en-US
  ac_language: en-US
  scope_dimensions: [CMS]   # PRD Scope 章节的分块维度＝本团队交付范围；CMS 团队交付内容中台本身，无 Android/iOS/小程序等端概念


team: CMS
display_name: CMS 团队

mcp:
  jira:
    host: https://marriottcloud.atlassian.net
    project_key: GCD
    issue_type: "故事"
    initial_status: Backlog
    agile_team: ""       # 空 = 无默认，人工填写
    labels: {}           # 空 = 无枚举规则，人工填写
    links: [prd, figma, tech_solution]

  confluence:
    base_url: https://marriottcloud.atlassian.net/wiki
    space: CMI
    parent_pages:
      # 文件夹模式（当前）：一级根目录「CMS Team Requirement Materials」页 ID（folder 类型）。
      # 发布脚本在此根下自动建/找 二级 {epic} → 三级 {epic}-PRD / {epic}-Tech Solution。
      # {epic} 一律取 Jira Epic key（如 CNAPP-5661），不用功能名或中文 slug，保证归档夹稳定可检索。
      root: "4175954245"             # 一级根目录页 ID（CMS Team Requirement Materials，prod/CMI，folder 类型）
      # 旧模式回退（直接父页，仅当未走文件夹模式时使用）：
      prd: "4184605008"
      tech_solution: "4175954245"
    folder_layout:                   # 文件夹层级约定（供 skill 说明用；实际由脚本 --root/--epic/--kind 落地）
      level1: "CMS Team Requirement Materials"       # 一级：固定根目录（即 parent_pages.root）
      level2: "{epic}"                              # 二级：Jira Epic key（如 CNAPP-5661）
      level3_prd: "{epic}-PRD"                      # 三级：PRD 归档夹
      level3_tech_solution: "{epic}-Tech Solution"  # 三级：技术方案归档夹
    naming:
      prd: CMS-PRD-{feature_name}-{date}-{version}
      tech_solution_epic: CMS-TS-Epic-{feature_name}-{date}-{version}
      tech_solution_spike: CMS-TS-Spike-{spike_key}-{topic}-{date}
      tech_solution_detail: CMS-TS-Detail-{story_key}-{title}-{date}
    content_format: markdown

  github:
    default_branch: main

# ---------------------------------------------------------------- 产物模板
artifacts:
  prd_kind: prd
  prd_template: references/prd-template.md
  user_story_template: references/user-story-cms.md

# ---------------------------------------------------------------- 内容模型
content_model:
  required: true

# ---------------------------------------------------------------- 产物语言
doc:
  body_language: zh-CN
  ac_language: zh-CN
  ac_format: GIVEN/WHEN/AND/THEN
